<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diagramas del proyecto</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: Arial, sans-serif;
            color: #25233b;
            background: linear-gradient(135deg, #eef2ff, #f5eaff);
        }

        main {
            width: 100%;
            max-width: 480px;
            padding: 40px 28px;
            text-align: center;
            background: #ffffff;
            border: 1px solid #eeeaf7;
            border-radius: 24px;
            box-shadow: 0 20px 60px #40307015;
        }

        .etiqueta {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 20px;
            background: #f0ebff;
            color: #6d45c2;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        h1 {
            margin: 20px 0 12px;
            font-size: clamp(26px, 5vw, 34px);
        }

        p {
            margin: 0 0 30px;
            color: #716c83;
            line-height: 1.6;
        }

        nav {
            display: grid;
            gap: 14px;
        }

        nav a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 20px;
            border: 1px solid #e5def5;
            border-radius: 14px;
            background: #faf8ff;
            color: #533594;
            text-decoration: none;
            font-weight: bold;
            text-align: left;
            transition: background 0.2s, color 0.2s, transform 0.2s;
        }

        nav a:hover {
            background: #7047c6;
            color: #ffffff;
            transform: translateY(-3px);
        }

        nav a:focus-visible {
            outline: 3px solid #7047c6;
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            nav a {
                transition: none;
            }

            nav a:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <main>

        <h1>Explora los diagramas</h1>
        <p>Selecciona un diagrama para conocer cada parte del proyecto.</p>

        <nav aria-label="Diagramas del proyecto">
            <a href="diagramflow_idea.html">
                Diagrama general
                <span aria-hidden="true">→</span>
            </a>

            <a href="diagram_customers.html">
                Adquisición de clientes
                <span aria-hidden="true">→</span>
            </a>

            <a href="diagram_bussiness_money.html">
                Generación de ingresos
                <span aria-hidden="true">→</span>
            </a>
        </nav>
    </main>
</body>

</html>
